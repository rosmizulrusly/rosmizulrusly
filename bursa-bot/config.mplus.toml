# M+ Online (Malacca Securities) preset.
#
# Copy to config.toml and CHECK THE NUMBERS against your own contract note - rates
# differ by account type (M+ Silver cash-upfront vs collateralised) and change over
# time. These are starting values, not a quote from the broker.
#
#   cp config.mplus.toml config.toml
#
# Two things worth doing with this broker specifically:
#  * M+ Silver is a cash-upfront account, so you are structurally unable to trade on
#    margin. That matches the bot's no-margin rule instead of fighting it.
#  * Malacca Securities is a window-based Islamic Participating Organisation on Bursa
#    Malaysia-i. Ask them to open a Shariah-compliant trading account and the
#    brokerage, settlement and cash legs are Shariah-structured too - not just the
#    stock list this bot screens against.

[paths]
data_dir = "data/prices"
sac_dir = "data/sac_lists"
calendar_file = "data/calendar/holidays.json"
ledger_file = "data/purification_ledger.json"

[account]
initial_cash = 20_000.0
rebalance = "monthly"

[fees]
brokerage_rate = 0.0005       # M+ Silver: from 0.05% per contract - CONFIRM YOURS
brokerage_min = 8.00          # RM8 minimum per contract
clearing_rate = 0.0003        # 0.03%, exchange charge
clearing_cap = 1000.0
stamp_duty_per_1000 = 1.00    # RM1 per RM1,000 or part thereof
stamp_duty_cap = 1000.0
service_tax_rate = 0.08       # SST on brokerage
service_tax_on_clearing = true

# A small account cannot carry ten positions: ten RM3,000 tickets is RM30,000 and the
# minimum brokerage alone eats 0.27% a side. Hold fewer, larger positions.
[limits]
max_gross_exposure = 0.95
max_position_weight = 0.25
max_adv_participation = 0.05
min_ticket_value = 5000.0
rebalance_band = 0.03
max_daily_loss = 0.03

[liquidity]
lookback_days = 20
min_avg_daily_value = 500_000.0
min_price = 0.30
min_history_days = 250

[trend]
trend_window = 200
momentum_window = 120
top_n = 6
min_momentum = 0.0
