[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bursabot"
version = "0.1.0"
description = "Shariah-screened, long-only trading bot scaffold for Bursa Malaysia"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
bursabot = "bursabot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
